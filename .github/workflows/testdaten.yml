# Holt echte Betriebe aus OpenStreetMap und legt sie ins Repository.
#
# Starten: Repository → Actions → "Testdaten holen" → "Run workflow".
# Danach liegen die Betriebe in src/data/orte.js und sind beim nächsten
# Start des Servers da.
#
# Warum ein Workflow und kein Skript, das man von Hand startet: Es gibt keinen
# Rechner. Und die Umgebung, in der dieses Repository entsteht, lässt Overpass
# nicht durch — ein Runner schon.
name: Testdaten holen

on:
  workflow_dispatch:
    inputs:
      gegend:
        description: 'Nur eine Gegend (leer = alle drei)'
        required: false
        default: ''
        type: choice
        options: ['', 'alcossebre', 'rheinmuenster', 'oberkirch']
      max:
        description: 'Höchstens so viele Betriebe je Gegend'
        required: false
        default: '120'

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    # Overpass ist ein Dienst von Freiwilligen und sagt oft „zu viele
    # Anfragen". Das Skript wartet dann und versucht es erneut — dafür
    # braucht der Lauf Luft.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aus OpenStreetMap holen
        run: |
          node tools/osm-import.mjs \
            ${{ inputs.gegend && format('--gegend {0}', inputs.gegend) || '' }} \
            --max ${{ inputs.max || '120' }}

      - name: Nachsehen, ob die Daten brauchbar sind
        run: node tools/orte-pruefen.mjs

      - name: Einchecken
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Erst vormerken, dann vergleichen. `git diff` allein sieht eine Datei
          # nicht, die es vorher noch gar nicht gab — beim ersten Lauf wurden
          # die Daten deshalb geholt, geprüft und weggeworfen.
          git add src/data/orte.js
          if git diff --cached --quiet; then
            echo 'Nichts Neues.'
            exit 0
          fi

          anzahl=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/orte.js','utf8')).betriebe.length)")
          git commit -m "Testdaten aus OpenStreetMap: ${anzahl} Betriebe

          Geholt von tools/osm-import.mjs. Quelle: OpenStreetMap-Mitwirkende, ODbL."
          git push
          echo "${anzahl} Betriebe eingecheckt." >> "$GITHUB_STEP_SUMMARY"
